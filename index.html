<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf7f2;
      --dark: #1a1612;
      --brown: #8b5e3c;
      --gold: #c9a84c;
      --light-brown: #d4a574;
      --text-muted: #6b5a4e;
      --white: #ffffff;
    }

    html { scroll-behavior: smooth; }

    html, body {
     overflow-x: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139, 94, 60, 0.15);
      transition: box-shadow 0.3s;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--dark);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .logo span { color: var(--gold); }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: var(--gold);
      transition: width 0.3s;
    }

    .nav-links a:hover { color: var(--dark); }
    .nav-links a:hover::after { width: 100%; }

    .call-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--dark);
      color: var(--white);
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .call-btn:hover { background: var(--brown); transform: translateY(-1px); }
    .call-btn svg { flex-shrink: 0; }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--dark);
      border-radius: 2px;
      transition: all 0.3s;
    }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 70px; left: 0; right: 0;
      background: var(--cream);
      padding: 24px 32px;
      flex-direction: column;
      gap: 20px;
      border-bottom: 1px solid rgba(139,94,60,0.15);
      z-index: 99;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      text-decoration: none;
      color: var(--dark);
      font-size: 1rem;
      font-weight: 500;
      padding: 8px 0;
      border-bottom: 1px solid rgba(139,94,60,0.1);
    }

    /* ── HERO ── */
    #home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 48px 60px;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      top: -100px; right: -100px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-bg-2 {
      position: absolute;
      bottom: -150px; left: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(139,94,60,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-content { max-width: 680px; position: relative; z-index: 1; }

    .hero-badge {
      display: inline-block;
      background: rgba(201,168,76,0.15);
      color: var(--brown);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
      border: 1px solid rgba(201,168,76,0.3);
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 24px;
      color: var(--dark);
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-desc {
      font-size: 1.1rem;
      line-height: 1.75;
      color: var(--text-muted);
      margin-bottom: 40px;
      max-width: 520px;
    }

    .hero-cta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      padding: 16px 32px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(201,168,76,0.35);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(201,168,76,0.45); }

    .btn-outline {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--dark);
      border: 1.5px solid var(--dark);
      padding: 16px 32px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s;
    }

    .btn-outline:hover { background: var(--dark); color: var(--white); }

    /* Stats */
    .hero-stats {
      display: flex;
      gap: 48px;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 1px solid rgba(139,94,60,0.15);
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--dark);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ── SECTIONS COMMON ── */
    section {
      padding: 100px 48px;
    }

    .section-tag {
      display: inline-block;
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 500px;
    }

    /* ── MENU ── */
    #menu { background: var(--white); }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 56px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .menu-tabs {
      display: flex;
      gap: 8px;
      background: var(--cream);
      padding: 6px;
      border-radius: 50px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--dark);
      color: var(--white);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .menu-card {
      background: var(--cream);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .menu-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.08); }
    .menu-card:hover::before { opacity: 1; }

    .menu-emoji { font-size: 2rem; }

    .menu-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .menu-card-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    .menu-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(139,94,60,0.1);
    }

    .menu-price {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--brown);
    }

    .menu-badge {
      font-size: 0.75rem;
      background: rgba(201,168,76,0.15);
      color: var(--brown);
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 500;
    }

    /* ── GALLERY ── */
    #gallery { background: var(--cream); }

    .gallery-header { margin-bottom: 48px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(3, 200px);
      gap: 16px;
    }

    .gallery-item {
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .gallery-item:nth-child(1) { grid-column: span 5; grid-row: span 2; }
    .gallery-item:nth-child(2) { grid-column: span 4; grid-row: span 1; }
    .gallery-item:nth-child(3) { grid-column: span 3; grid-row: span 1; }
    .gallery-item:nth-child(4) { grid-column: span 4; grid-row: span 1; }
    .gallery-item:nth-child(5) { grid-column: span 3; grid-row: span 1; }
    .gallery-item:nth-child(6) { grid-column: span 7; grid-row: span 1; }
    .gallery-item:nth-child(7) { grid-column: span 5; grid-row: span 1; }

    .gallery-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      transition: transform 0.4s;
      position: relative;
    }

    /* Gallery placeholder colors */
    .g1 { background: linear-gradient(135deg, #8b5e3c, #c9a84c); }
    .g2 { background: linear-gradient(135deg, #4a3728, #8b5e3c); }
    .g3 { background: linear-gradient(135deg, #c9a84c, #d4a574); }
    .g4 { background: linear-gradient(135deg, #d4a574, #faf7f2); }
    .g5 { background: linear-gradient(135deg, #8b5e3c, #4a3728); }
    .g6 { background: linear-gradient(135deg, #c9a84c, #8b5e3c); }
    .g7 { background: linear-gradient(135deg, #4a3728, #c9a84c); }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26,22,18,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .gallery-item:hover .gallery-overlay { background: rgba(26,22,18,0.45); }

    .gallery-overlay-text {
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .gallery-item:hover .gallery-overlay-text { opacity: 1; }
    .gallery-item:hover .gallery-img { transform: scale(1.05); }

    /* ── ABOUT ── */
    #about { background: var(--dark); color: var(--white); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    #about .section-tag { color: var(--gold); }
    #about .section-title { color: var(--white); }
    #about .section-subtitle { color: rgba(255,255,255,0.6); }

    .about-features {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 36px;
    }

    .about-feature {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .feature-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .feature-text h4 {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--white);
    }

    .feature-text p { font-size: 0.9rem; color: rgba(255,255,255,0.55); line-height: 1.6; }

    .about-visual {
      position: relative;
    }

    .about-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .about-card::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    .about-quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--white);
      margin-bottom: 24px;
    }

    .about-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .author-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--brown));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .author-name { font-weight: 600; color: var(--white); }
    .author-role { font-size: 0.85rem; color: rgba(255,255,255,0.5); }

    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 24px;
    }

    .about-stat {
      background: rgba(255,255,255,0.06);
      padding: 24px 20px;
      text-align: center;
    }

    .about-stat .num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold);
    }

    .about-stat .lbl {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    /* ── CONTACT ── */
    #contact { background: var(--white); }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 80px;
      align-items: start;
    }

    .contact-info { display: flex; flex-direction: column; gap: 28px; }

    .contact-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .contact-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .contact-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .contact-value {
      font-weight: 600;
      color: var(--dark);
      font-size: 1rem;
    }

    .contact-value a {
      color: inherit;
      text-decoration: none;
    }

    .contact-value a:hover { color: var(--brown); }

    /* Form */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dark);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 14px 18px;
      border: 1.5px solid rgba(139,94,60,0.2);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--dark);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--gold);
      background: white;
    }

    .form-group textarea { height: 120px; }

    .form-submit {
      background: var(--dark);
      color: white;
      border: none;
      padding: 16px 36px;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: all 0.25s;
    }

    .form-submit:hover { background: var(--brown); transform: translateY(-2px); }

    .form-success {
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--brown);
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 32px 48px;
      font-size: 0.9rem;
    }

    footer a { color: var(--gold); text-decoration: none; }

    /* ── FLOATING CALL BUTTON ── */
    .floating-call {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 200;
      background: var(--gold);
      color: var(--dark);
      border: none;
      width: 60px; height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(201,168,76,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(201,168,76,0.45); }
      50% { box-shadow: 0 8px 48px rgba(201,168,76,0.65), 0 0 0 12px rgba(201,168,76,0.1); }
    }

    .floating-call:hover { transform: scale(1.1); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .nav-links { display: none; }
      .call-btn.desktop { display: none; }
      .hamburger { display: flex; }

      section { padding: 70px 24px; }
      #home { padding: 100px 24px 60px; }

      .hero-stats { gap: 28px; }

      .about-grid,
      .contact-grid { grid-template-columns: 1fr; gap: 40px; }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
      }

      .gallery-item { grid-column: span 1 !important; grid-row: span 1 !important; height: 180px; }

      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ── DATA ──────────────────────────────────────────────
const MENU_ITEMS = {
  All: [
    { emoji: "☕", name: "Classic Espresso", desc: "Rich, bold espresso with a perfect crema, sourced from single-origin beans.", price: "₹120", badge: "Popular" },
    { emoji: "🍰", name: "Butter Croissant", desc: "Flaky, golden croissant baked fresh every morning with imported butter.", price: "₹95", badge: "Fresh" },
    { emoji: "🥗", name: "Garden Salad Bowl", desc: "Seasonal greens with house vinaigrette, roasted nuts, and feta cheese.", price: "₹220", badge: null },
    { emoji: "🍵", name: "Masala Chai", desc: "Traditional Indian spiced tea brewed with whole spices and fresh ginger.", price: "₹80", badge: "Bestseller" },
    { emoji: "🍕", name: "Margherita Pizza", desc: "San Marzano tomatoes, fresh mozzarella, basil on a wood-fired crust.", price: "₹380", badge: null },
    { emoji: "🍮", name: "Crème Brûlée", desc: "Classic French custard with a perfectly caramelized golden sugar top.", price: "₹180", badge: "Chef's Pick" },
  ],

function Contact() {
  const [sent, setSent] = useState(false);
  const [form, setForm] = useState({ name: "", email: "", phone: "", subject: "", message: "" });

  const handleChange = e => setForm({ ...form, [e.target.name]: e.target.value });

  const handleSubmit = () => {
    if (!form.name || !form.email || !form.message) return alert("Please fill in Name, Email, and Message.");
    setSent(true);
    setForm({ name: "", email: "", phone: "", subject: "", message: "" });
  };
 
  return (
    <section id="contact">
      <div className="contact-grid">
        <div>
          <span className="section-tag">✦ Get In Touch</span>
          <h2 className="section-title">Contact Us</h2>
          <p className="section-subtitle">We'd love to hear from you. Reach out for reservations, events, or just to say hello.</p>
          <div className="contact-info" style={{marginTop: "36px"}}>
            {[
              ["📍", "Address", "Near Saibaba temple, Shirdi, Maharashtra - 423109"],
              ["📞", "Phone", <a href="tel:+919876543210">+91 98765 43210</a>],
              ["✉️", "Email", <a href="mailto:hello@SaiShubham.in">hello@SaiShubham.in</a>],
              ["🕐", "Hours", "Mon–Sun: 8:00 AM – 10:30 PM"],
            ].map(([icon, label, value]) => (
              <div key={label} className="contact-card">
                <div className="contact-icon">{icon}</div>
                <div>
                  <div className="contact-label">{label}</div>
                  <div className="contact-value">{value}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="contact-form">
          {sent ? (
            <div className="form-success">
              ✅ Thank you! We'll get back to you within 24 hours.
            </div>
          ) : null}
          <div className="form-row">
            <div className="form-group">
              <label>Your Name *</label>
              <input name="name" value={form.name} onChange={handleChange} placeholder="Rahul Sharma" />
            </div>
            <div className="form-group">
              <label>Email Address *</label>
              <input name="email" type="email" value={form.email} onChange={handleChange} placeholder="rahul@email.com" />
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>Phone Number</label>
              <input name="phone" type="tel" value={form.phone} onChange={handleChange} placeholder="+91 XXXXX XXXXX" />
            </div>
            <div className="form-group">
              <label>Subject</label>
              <select name="subject" value={form.subject} onChange={handleChange}>
                <option value="">Select a topic…</option>
                <option>Table Reservation</option>
                <option>Private Event</option>
                <option>Catering Enquiry</option>
                <option>Feedback</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label>Message *</label>
            <textarea name="message" value={form.message} onChange={handleChange} placeholder="Tell us how we can help…" />
          </div>
          <button className="form-submit" onClick={handleSubmit}>Send Message →</button>
        </div>
      </div>
    </section>
  );
}
